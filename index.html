<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الرسائل الذكية - SMS Gateway Dashboard</title>
    <!-- استيراد خط عربي عصري (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            /* خلفية احترافية داكنة مع تدرج لوني راقٍ */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* شريط التنقل العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .logo-area span {
            font-size: 12px;
            color: #22d3ee;
            display: block;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #4ade80;
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        /* المحتوى الرئيسي */
        main {
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
            flex: 1;
        }

        /* بطاقات الإحصائيات */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(5px);
        }

        .metric-card i {
            font-size: 28px;
            color: #22d3ee;
        }

        .metric-info h3 {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
        }

        .metric-info p {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        /* نموذج الإرسال (Dashboard Panel) */
        .dashboard-panel {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .dashboard-panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffffff;
            border-right: 4px solid #22d3ee;
            padding-right: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #22d3ee;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 45px 14px 15px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
        }

        textarea.form-control {
            resize: none;
            height: 100px;
            padding-top: 14px;
        }

        .btn-submit {
            background: #22d3ee;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #06b6d4;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
        }

        #statusMessage {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #f59e0b;
        }

        /* سجل العمليات */
        .logs-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .log-item {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .log-info span {
            display: block;
        }

        .log-phone {
            font-weight: 700;
            color: #ffffff;
        }

        .log-status {
            color: #94a3b8;
            font-size: 11px;
        }

        .log-time {
            color: #22d3ee;
            font-size: 12px;
        }

        /* التذييل (Footer) */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(15, 23, 42, 0.5);
        }

        /* استجابة الشاشات الصغيرة */
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            main { width: 95%; margin: 20px auto; }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <div class="logo-area">
            <h1>بوابة الرسائل الذكية</h1>
            <span>Smart SMS Gateway Dashboard</span>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>النظام جاهز للربط</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- إحصائيات سريعة -->
        <div class="metrics-grid">
            <div class="metric-card">
                <i class="fa-solid fa-bolt"></i>
                <div class="metric-info">
                    <h3>حالة البوابة</h3>
                    <p id="gatewayStatus">مستقر (Online)</p>
                </div>
            </div>
            <div class="metric-card">
                <i class="fa-solid fa-envelope-circle-check"></i>
                <div class="metric-info">
                    <h3>الرسائل المرسلة</h3>
                    <p id="sentCount">0</p>
                </div>
            </div>
        </div>

        <!-- لوحة التحكم وإرسال الرسائل -->
        <div class="dashboard-panel">
            <h2>إرسال رسالة تحقق (OTP)</h2>
            <form id="smsForm">
                <div class="form-group">
                    <label for="phone">رقم المستلم</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text" id="phone" class="form-control" placeholder="مثال: +967770000000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">نص الرسالة أو كود الـ OTP</label>
                    <div class="input-with-icon" style="align-items: flex-start;">
                        <i class="fa-solid fa-message" style="top: 20px;"></i>
                        <textarea id="message" class="form-control" placeholder="رمز التحقق الخاص بك هو: 1234" required></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> إرسال عبر بوابة الـ SMS
                </button>
            </form>
            <div id="statusMessage"></div>
        </div>

        <!-- سجل العمليات -->
        <div class="logs-section">
            <h3>سجل العمليات الأخير</h3>
            <div id="logsContainer">
                <div class="log-item" style="justify-content: center; color: #64748b;">
                    لا توجد عمليات إرسال مسجلة حتى الآن
                </div>
            </div>
        </div>
    </main>

    <!-- التذييل -->
    <footer>
        <p>جميع الحقوق محفوظة © بوابة الرسائل الذكية | Android 15 Gateway System</p>
    </footer>

    <!-- سكربت تفاعلي للوحة التحكم -->
    <script>
        let sentMessagesCount = 0;
        const form = document.getElementById('smsForm');
        const phoneInput = document.getElementById('phone');
        const messageInput = document.getElementById('message');
        const statusMessage = document.getElementById('statusMessage');
        const sentCountDisplay = document.getElementById('sentCount');
        const logsContainer = document.getElementById('logsContainer');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = phoneInput.value.trim();
            const message = messageInput.value.trim();

            if(!phone || !message) return;

            statusMessage.textContent = "جاري إرسال الطلب عبر الشبكة...";
            statusMessage.style.color = "#f59e0b";

            // محاكاة عملية الإرسال الناجحة للتجربة
            setTimeout(() => {
                sentMessagesCount++;
                sentCountDisplay.textContent = sentMessagesCount;
                statusMessage.textContent = "تم إرسال الرسالة بنجاح عبر الشريحة!";
                statusMessage.style.color = "#4ade80";

                // إضافة العملية للسجل
                const now = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
                
                // إزالة رسالة "لا توجد عمليات" إن وجدت
                if(sentMessagesCount === 1) {
                    logsContainer.innerHTML = '';
                }

                const logItem = document.createElement('div');
                logItem.className = 'log-item';
                logItem.innerHTML = `
                    <div class="log-info">
                        <span class="log-phone">${phone}</span>
                        <span class="log-status">تم الإرسال بنجاح (OTP)</span>
                    </div>
                    <span class="log-time">${now}</span>
                `;
                
                logsContainer.prepend(logItem);
                form.reset();
            }, 1000);
        });
    </script>
</body>
</html>
